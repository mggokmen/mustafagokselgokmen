name: Web (Next.js)

on:
  # No path filter on pull requests: every pull request reports these checks, so branch protection
  # can require them (docs/devops.md#branch-protection).
  pull_request:
  push:
    branches: [main, develop]
    paths:
      - frontend/nextjs/**
      # The API types are generated from the contract, so a contract change can break this build.
      - contract/openapi.yaml
      - .github/workflows/web.yml
  # Path filters skip a branch's first push; this allows a manual run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build and test the web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nextjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/nextjs/package-lock.json
      - run: npm ci
      # The API types aren't committed; everything below depends on them.
      - name: Generate API types from the contract
        run: npm run gen:api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # The build reads the configuration but calls nothing.
          API_BASE_URL: http://localhost:8080
          APP_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: build-only
          GOOGLE_CLIENT_SECRET: build-only

  image:
    name: Web image and vulnerability scan
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/nextjs/Dockerfile
          tags: mustafagokselgokmen-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mustafagokselgokmen-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: Web end-to-end tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/nextjs/package-lock.json
      - run: npm ci
        working-directory: frontend/nextjs
      - run: npx playwright install --with-deps chromium
        working-directory: frontend/nextjs
      # Starts PostgreSQL, the API and a mock identity provider, then drives a real browser
      # through sign-in (docs/testing.md#web).
      - run: bash frontend/nextjs/e2e/run-tests.sh
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/nextjs/playwright-report/
