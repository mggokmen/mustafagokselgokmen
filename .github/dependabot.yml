version: 2

updates:
  - package-ecosystem: maven
    directory: /backend/spring-boot
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]

  - package-ecosystem: maven
    directory: /backend/notification-service
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]

  - package-ecosystem: npm
    directory: /frontend/nextjs
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # The type definitions follow the runtime, and the image's Node major is a project decision
      # of its own (see the Docker entry below).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10 breaks the eslint-plugin-react that eslint-config-next bundles. It can come back
      # when Next ships a configuration that works with it.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # Java and PostgreSQL major versions are project decisions, not bot updates (docs/devops.md).
  - package-ecosystem: docker
    directory: /backend/spring-boot
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend/notification-service
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend/nextjs
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Moving to a new major Node version changes the build, the image and CI together.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
