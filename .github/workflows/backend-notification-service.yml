name: Notification service

on:
  # No path filter on pull requests: every pull request reports these checks, so branch protection
  # can require them (docs/devops.md#branch-protection).
  pull_request:
  push:
    branches: [main, develop]
    paths:
      - backend/notification-service/**
      - .github/workflows/backend-notification-service.yml
  # Path filters skip a branch's first push; this allows a manual run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build and test the notification service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/notification-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Format check (Spotless), compilation, and the consumer tests against PostgreSQL and Kafka
      # in Testcontainers.
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: notification-surefire-reports
          path: backend/notification-service/target/surefire-reports/

  image:
    name: Notification image and vulnerability scan
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/notification-service/Dockerfile
          tags: mustafagokselgokmen-notification:ci
          load: true
          cache-from: type=gha,scope=notification
          cache-to: type=gha,scope=notification,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mustafagokselgokmen-notification:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
