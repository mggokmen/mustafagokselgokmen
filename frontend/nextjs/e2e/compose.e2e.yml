# Backend stack for the web end-to-end tests, layered on the repository's docker-compose.yml.
# Started by e2e/run-tests.sh; the web app itself is started by Playwright.
#
# Sign-in goes through a mock OpenID Connect provider instead of Google. The browser, the web app
# and the API must agree on the issuer, so the provider is published on the host under the address
# the browser uses, while the API fetches its keys over the container network.
#
# Ports differ from the development stack, so this can run next to it.
services:
  postgres:
    ports: !reset []

  # The web tests check the API's responses, not the broker or its consumer.
  kafka:
    profiles: [unused]

  notification:
    profiles: [unused]

  api:
    ports: !override
      - "18080:8080"
    depends_on: !override
      postgres:
        condition: service_healthy
      mock-oidc:
        condition: service_started
    environment:
      OUTBOX_TARGET: log
      GOOGLE_CLIENT_IDS: web-e2e
      ADMIN_EMAILS: admin@example.com
      # One provider, reachable under two addresses: the browser and the app instances on the host
      # use localhost, anything inside the network uses the service name. It signs with the same key
      # either way, so the API accepts both spellings of the issuer.
      GOOGLE_ISSUERS: http://localhost:18090/google,http://mock-oidc:8080/google
      GOOGLE_JWKS_URI: http://mock-oidc:8080/google/jwks
      # Every test signs in, and all of them reach the API from the web app's single address, so
      # they share one bucket (docs/security.md#rate-limiting). Sign-in rate limiting is covered by
      # the backend's own tests; these tests are about the flow.
      RATE_LIMIT_SIGN_IN_REQUESTS: "100000"
      RATE_LIMIT_REFRESH_REQUESTS: "100000"
      # The message limit stays as it ships: one test asserts what a visitor is told when they
      # reach it.

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    environment:
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ./frontend/nextjs/e2e/mock-oidc.json:/config/mock-oidc.json:ro
    ports:
      - "18090:8080"
