# Local development stack. Copy .env.example to .env first.
#   docker compose up -d postgres   # database only (run the API from an IDE)
#   docker compose up --build       # database, broker, API and notification service
name: mustafagokselgokmen

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mustafagokselgokmen}
      POSTGRES_USER: ${POSTGRES_USER:-mustafagokselgokmen}
      # Every :? variable below is required and comes from .env (see .env.example). The message
      # stays out of the value, so secret scanners don't read it as one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Read by the init script below, which gives the notification service a database of its own.
      NOTIFICATION_DB: ${NOTIFICATION_DB:-mustafagokselgokmen_notification}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
    ports:
      # 5433 on the host avoids a clash with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # Single-node KRaft: this one container is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: containers reach the broker as kafka:9092, the host as localhost:29092.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/spring-boot/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mustafagokselgokmen}
      DB_USER: ${POSTGRES_USER:-mustafagokselgokmen}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:?}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      OUTBOX_TARGET: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/nextjs/Dockerfile
    environment:
      # The browser calls this app, and this app calls the API over the network below.
      API_BASE_URL: http://api:8080
      APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${WEB_GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${WEB_GOOGLE_CLIENT_SECRET:?}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${NOTIFICATION_DB:-mustafagokselgokmen_notification}
      DB_USER: ${NOTIFICATION_DB_USER:-notification}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
