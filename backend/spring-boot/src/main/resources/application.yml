spring:
  application:
    name: api
  config:
    # Local runs read secrets from backend/spring-boot/.env (gitignored). Containers use real
    # environment variables instead.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    # Optional fields are absent, not null (docs/api.md#request-and-response-models).
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  # Events are written with the change that produced them and published from here (ADR-008).
  outbox:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    batch-size: 100
    poll-interval: 1s

  # Requests per client IP, counted by this instance (docs/security.md#rate-limiting).
  rate-limit:
    sign-in:
      requests: ${RATE_LIMIT_SIGN_IN_REQUESTS:10}
      per: 1m
    refresh:
      requests: ${RATE_LIMIT_REFRESH_REQUESTS:30}
      per: 1m
    # Keyed by user, not by IP.
    contact-message:
      requests: ${RATE_LIMIT_CONTACT_MESSAGE_REQUESTS:5}
      per: 1h
  identity:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    admin-emails: ${ADMIN_EMAILS:}
    google:
      client-ids: ${GOOGLE_CLIENT_IDS}
      issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}
      jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
